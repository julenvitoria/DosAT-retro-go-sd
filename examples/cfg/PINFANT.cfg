; Pinball Fantasies (Digital Illusions / 21st Century, 1992) -- para dosat.bin
; Va en /cores/dosat/ (el PINFANT.dsk, en /roms/dos/). Opciones del .cfg: docs/cfg.md del repo.
; Hace falta el dos386.bin del 03-11-2026 (tarde): sin el, la intro se queda parada.
; Sonido: ya viene configurado para Sound Blaster 16 (SOUND.CFG).
; El titulo tarda medio minuto en aceptar START (esta cargando).
; En el menu: TIME (F1) elige Partyland; F2-F4, desde el teclado en pantalla (GAME).
; En la mesa: B / izquierda = flipper izquierdo, A / derecha = flipper derecho,
; abajo = muelle (mantener y soltar), arriba = empujar la mesa,
; START = Intro, SELECT = Esc. Lo dice el propio juego en el marcador:
; "CONTROL SPRING WITH DOWN ARROW KEY", "PUSH TABLE WITH SPACE".

; Velocidad FIJA: sin ella el juego calibra mal sus interrupciones de pantalla
; y la partida no arranca nunca (F1 no hace nada en la mesa). Con ella arranca,
; pero aun falla mas o menos uno de cada cuatro arranques: si la pantalla se
; queda negra o parada, volver a lanzar el juego.
[cpu]
cycles = 2200

[gamepad]
b      = shift     ; flipper izquierdo
a      = rshift    ; flipper derecho
left   = shift
right  = rshift
down   = down      ; muelle
up     = space     ; empujar la mesa
start  = enter
select = esc
time   = f1

; El juego desplaza la pantalla por toda la memoria de video (como Epic Pinball)
; y pone el titulo y el menu de mesas en el modo de 640x480 con 16 colores, que
; solo existe con la tarjeta completa. Sin esta clave los logos salen dobles y
; el menu, punteado sobre negro.
[video]
vga_pages = 3
